<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1d4ed8">
<title>天津中考全科复习 App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#2563eb;--primary2:#3b82f6;--danger:#ef4444;--success:#16a34a;--warn:#d97706;--bg:#eef1f6;--card:#fff;--line:#e5e7eb;--text:#111827;--muted:#6b7280;--r:14px}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#c9ced9;color:var(--text);font-size:15px}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 28px rgba(0,0,0,.14)}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;padding:12px 12px;display:flex;align-items:center;gap:8px}
.topbar .back{font-size:20px;cursor:pointer;padding:2px 8px 2px 2px;border:none;background:none;color:#fff;line-height:1}
.topbar h1{font-size:17px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .right{font-size:12px;opacity:.92;white-space:nowrap}
.view{padding:12px;padding-bottom:82px}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .tab{flex:1;text-align:center;padding:8px 0 6px;color:var(--muted);font-size:11px;cursor:pointer;border:none;background:none}
.tabbar .tab .ic{font-size:20px;display:block;margin-bottom:2px}
.tabbar .tab.active{color:var(--primary);font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.muted{color:var(--muted);font-size:12px}
.small{font-size:12px}
.flex{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{border:none;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{opacity:.8}
.btn.block{width:100%}
.btn.ghost{background:#eef2ff;color:var(--primary)}
.btn.danger{background:#fee2e2;color:var(--danger)}
.btn.success{background:#dcfce7;color:var(--success)}
.btn.warn{background:#fef3c7;color:var(--warn)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.chip{display:inline-block;padding:4px 10px;border-radius:20px;background:#eef2ff;color:var(--primary);font-size:12px;margin:3px 3px 0 0;cursor:pointer;border:1px solid #dbeafe}
.chip.on{background:var(--primary);color:#fff}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px}
.badge.red{background:#fee2e2;color:var(--danger)}
.badge.green{background:#dcfce7;color:var(--success)}
.badge.blue{background:#dbeafe;color:var(--primary)}
.badge.amber{background:#fef3c7;color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.s-card{background:var(--card);border-radius:var(--r);padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.s-card .ic{font-size:24px;display:block;margin-bottom:4px}
.s-card .nm{font-size:13px;font-weight:600}
.s-card .sc{font-size:11px;color:var(--muted)}
.sec{font-size:13px;font-weight:600;color:var(--muted);margin:14px 2px 8px}
.li{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border-radius:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer}
.li .ic{font-size:20px}
.li .tx{flex:1;min-width:0}
.li .tx .t{font-size:14px;font-weight:600}
.li .tx .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{color:#c0c6d1}
.hero{background:linear-gradient(135deg,#1d4ed8,#3b82f6);border-radius:var(--r);color:#fff;padding:16px;margin-bottom:12px}
.hero .days{font-size:32px;font-weight:800}
.hero .dl{display:flex;gap:8px;margin-top:10px}
.hero .dl .it{flex:1;background:rgba(255,255,255,.16);border-radius:10px;padding:8px 6px;text-align:center;font-size:11px}
.hero .dl .it b{display:block;font-size:15px;margin-top:2px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.qk{background:var(--card);border-radius:12px;padding:10px 4px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.qk .ic{font-size:22px;display:block}
.qk .nm{font-size:11px;margin-top:4px;font-weight:600}
.progress{height:8px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--primary);border-radius:6px}
.kp-card{border-left:4px solid var(--primary);background:var(--card);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer}
.kp-card .nm{font-size:14px;font-weight:700}
.kp-card .tag{font-size:11px;color:var(--muted);margin-top:3px}
.example{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.example .q{font-size:13px;line-height:1.7}
.example .a{font-size:13px;color:var(--success);margin-top:6px;font-weight:600}
.example .s{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
.camera{background:#0f172a;border-radius:var(--r);min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cbd5e1;padding:16px;text-align:center;position:relative;overflow:hidden}
.camera .frame{position:absolute;inset:14px;border:2px dashed rgba(255,255,255,.5);border-radius:12px;pointer-events:none}
.camera img{max-width:100%;max-height:260px;border-radius:8px}
.switch{width:46px;height:26px;border-radius:13px;background:#cbd5e1;position:relative;cursor:pointer;flex-shrink:0;transition:.2s}
.switch.on{background:var(--success)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on::after{left:23px}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0}
.bar .lb{width:86px;font-size:12px;color:var(--muted);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{flex:1;background:#e5e7eb;border-radius:6px;height:12px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--primary);border-radius:6px}
.bar .vl{width:34px;font-size:12px;font-weight:600}
.tree{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px;line-height:1.8;white-space:pre;overflow-x:auto}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fff}
.word-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.word-row .en{font-size:15px;font-weight:700;flex:1}
.word-row .cn{font-size:12px;color:var(--muted)}
.word-row .ok,.word-row .no{width:56px;text-align:center;padding:6px 0;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid var(--line)}
.word-row .ok.ok-on{background:var(--success);color:#fff;border-color:var(--success)}
.word-row .no.no-on{background:var(--danger);color:#fff;border-color:var(--danger)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat3 .it{background:var(--card);border-radius:12px;text-align:center;padding:12px 4px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat3 .it b{font-size:20px;display:block}
.stat3 .it span{font-size:11px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:99;display:none;max-width:82%;text-align:center}
.spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:32px 0;font-size:13px}
.tag-sample{background:#ede9fe;color:#7c3aed}
.opt{display:block;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px;cursor:pointer;font-size:14px;line-height:1.5}
.opt.right{border-color:var(--success);background:#f0fdf4;color:var(--success);font-weight:600}
.opt.wrong{border-color:var(--danger);background:#fef2f2;color:var(--danger)}
.opt:disabled{cursor:default}
.timer{font-size:22px;font-weight:800;color:var(--primary)}
.qa-index{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:8px;background:#eef2ff;color:var(--primary);font-size:13px;font-weight:700;margin-right:6px}
.exam-head{background:linear-gradient(135deg,#7c3aed,#4f46e5);border-radius:var(--r);color:#fff;padding:14px;margin-bottom:12px}
.exam-head .timer{color:#fff}
.num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:#eef2ff;color:var(--primary);align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}

.play{display:inline-flex;width:30px;height:30px;border-radius:50%;background:#eef2ff;color:var(--primary);align-items:center;justify-content:center;cursor:pointer;font-size:15px;flex-shrink:0}
.ox{font-size:11px;color:var(--primary);text-decoration:none;border:1px solid #dbeafe;border-radius:8px;padding:3px 6px;white-space:nowrap;flex-shrink:0}
.pos{font-size:11px;color:var(--muted);font-weight:400}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="view" id="view"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="toast"></div>
<script>
'use strict';
/* ========== 科目与栏目（成品版全量） ========== */
const SUBJECTS = [
  {id:'chinese', name:'语文', score:'120分 · 闭卷', icon:'📖', color:'#e11d48', columns:['基础积累与运用','古诗文默写','文言文阅读','现代文阅读','名著阅读','写作','天津真题与模拟']},
  {id:'math', name:'数学', score:'120分 · 闭卷', icon:'📐', color:'#2563eb', columns:['数与代数','图形与几何','统计与概率','综合与实践','压轴题专项','数学思想方法','天津真题与模拟']},
  {id:'english', name:'英语', score:'120分 · 笔试100+听力20', icon:'🔤', color:'#7c3aed', columns:['词汇','语法','听力（机考20分）','完形填空','阅读理解','补全对话','综合填空','书面表达','计划性默写','天津真题与模拟']},
  {id:'physics', name:'物理', score:'100分 · 闭卷', icon:'⚛️', color:'#0891b2', columns:['声学','光学','力学','热学','电学','能源与可持续发展','实验探究','题型专练','天津真题与模拟']},
  {id:'chemistry', name:'化学', score:'100分 · 闭卷', icon:'🧪', color:'#059669', columns:['物质的组成与结构','身边的化学物质','物质的变化','化学计算','化学实验','化学与社会','天津真题与模拟']},
  {id:'moral', name:'道德与法治', score:'100分 · 开卷', icon:'⚖️', color:'#b45309', columns:['成长中的我','我与他人和集体','我与国家和社会','国情国策与时事','题型专练','开卷资料整理','天津真题与模拟']},
  {id:'history', name:'历史', score:'100分 · 开卷', icon:'🏛️', color:'#92400e', columns:['中国古代史','中国近代史','中国现代史','世界古代史','世界近代史','世界现代史','题型专练','天津真题与模拟']},
  {id:'sports', name:'体育与健康', score:'40分 · 平时18+统测22', icon:'🏃', color:'#ea580c', columns:['政策与规则','必测项','选测项一','选测项二','评分标准查询','训练计划','体质与安全','平时成绩管理']},
  {id:'geo', name:'地理（八年级）', score:'等级考 · 优良合格', icon:'🌏', color:'#0d9488', columns:['地球与地图','世界地理','中国地理','天津乡土地理','题型专练','历年真题']},
  {id:'bio', name:'生物（八年级）', score:'等级考 · 优良合格', icon:'🧬', color:'#65a30d', columns:['生物体的结构层次','绿色植物','生物圈中的人','其他生物','生物的多样性','生命的延续与发展','生物技术','实验与探究','历年真题']}
];

/* ========== 知识点库（每课：查找 → 诠释 → 举例） ==========
   格式：key=科目id:栏目 → [{title:课名, kps:[{name,expl,tips,ex:[[题干,答案,解析],…]}]}]
   ex 的解析字符串中以【】标注“易错点”。 */
const KP = {

/* ---------- 语文 ---------- */
'chinese:基础积累与运用':[{title:'第1课 · 字音字形与病句',kps:[
 {name:'易错字音（多音字·形近字）',expl:'中考第1题常考多音字与形近字。多音字“据义定音”，如“角”：角色读jué、角度读jiǎo；注意平翘舌（zh/ch/sh 与 z/c/s）和前后鼻音（in/ing、en/eng）。',tips:'考向：字音辨析题，2~3分，用“组词记忆法”积累。',ex:[['下列加点字读音完全正确的一项是：A.角色(jiǎo) B.堵塞(sè) C.慰藉(jí) D.提防(tí)','B。A角jué；C藉jiè；D提dī。','【易错】慰藉的“藉”常被误读为jí。','多音字要据义定音，建议每天积累10个。']]},
 {name:'病句辨析与修改',expl:'常见病句：搭配不当、成分残缺、语序不当、句式杂糅、两面失衡。方法：压缩主干看主谓宾，再看修饰与搭配。',tips:'考向：选“没有语病的一项”或修改病句。',ex:[['下列句子没有语病的一项是：A.通过这次活动，使我增长了见识。B.我们要发扬和继承优良传统。C.他的写作水平明显改进了。D.我认真听取了大家的意见。','D。A缺主语；B语序不当应“继承和发扬”；C“水平”应搭配“提高”。','【易错】A项“通过/使”同时出现即缺主语。']]}
]}],

'chinese:古诗文默写':[{title:'第1课 · 理解性默写',kps:[
 {name:'理解性默写定位',expl:'抓住题干关键词定位诗句：如“比喻人生困难”“表达远大抱负”。易错字必须逐字过关。',tips:'考向：默写6~8分，理解性默写是拉分点。',ex:[['《行路难》中表达诗人对未来充满信心的句子：＿＿＿＿，＿＿＿＿。','长风破浪会有时，直挂云帆济沧海。','【易错】“济”字易写成“记”。']]},
 {name:'易错句专项',expl:'常考易错句：如“海内存知己”（己非已）、“千里共婵娟”（婵非蝉）、“大漠孤烟直”（漠非莫）。',tips:'建立“易错句本”，每周听写一次。',ex:[['默写“大漠孤烟直，＿＿＿＿”。','长河落日圆。','【易错】“圆”勿写“园”。']]}
]}],

'chinese:文言文阅读':[{title:'第1课 · 课内重点篇目',kps:[
 {name:'文言实词一词多义',expl:'如“之”：助词“的”/取消句子独立性/代词/动词“去往”；“以”：用、因为、来。翻译要字字落实、补省略。',tips:'考向：实词解释、句子翻译、文意理解。',ex:[['解释加点词：渔人甚异之（《桃花源记》）。','异：对……感到惊异（意动用法）。','【易错】意动用法是高频考点。']]},
 {name:'句子翻译三步',expl:'留（专有名词）、删（无义虚词）、补（省略成分）+调整语序，直译为主、意译为辅。',tips:'翻译题按点给分，关键词必须译出。',ex:[['翻译“此人一一为具言所闻，皆叹惋”。','这个人把自己听到的事一一详细地告诉他们，（他们）都感叹惋惜。','【易错】“为”后省略“之”，要补出。']]}
]}],

'chinese:现代文阅读':[{title:'第1课 · 记叙文阅读',kps:[
 {name:'赏析句子（手法+内容+情感）',expl:'答题模板：运用了××手法（修辞/描写），生动形象地写出了××（内容），表达了××（情感）。',tips:'考向：第3~5题，分值大，套模板不丢分。',ex:[['赏析：“阳光像碎金一样洒在母亲的白发上。”','比喻，把阳光比作碎金，生动形象地写出阳光洒在白发上的情态，表达对母亲的心疼与爱。','【易错】只答手法不答情感会扣分。']]},
 {name:'概括主旨',expl:'“文章通过写××（事），表达了××（情/理）”。先找线索与人物，再归纳中心。',tips:'概括题要“人物+事件+情感”。',ex:[['请概括《背影》一文的主旨。','文章通过回忆父亲送“我”时爬月台买橘子的背影，表达了父子深情。','【易错】只写事件不写情感。']]}
]}],

'chinese:名著阅读':[{title:'第1课 · 必读书目导读',kps:[
 {name:'《朝花夕拾》人物与主题',expl:'鲁迅回忆性散文集，共10篇。常考：长妈妈、藤野先生、范爱农、衍太太。',tips:'考向：选择题/简答题，记牢篇目与人物事件对应。',ex:[['《朝花夕拾》中鲁迅最敬重的日本老师是？','藤野先生。','【易错】勿与《藤野先生》篇目名混淆。']]},
 {name:'《西游记》人物与情节',expl:'孙悟空“大闹天宫”“三打白骨精”；猪八戒憨厚又贪小便宜；唐僧坚定而有时不辨是非。',tips:'考向：人物形象+情节对应。',ex:[['“三打白骨精”中，被白骨精先后变化的三个形象是？','村姑、老妇人、老公公。','【易错】顺序不能颠倒。']]}
]}],

'chinese:写作':[{title:'第1课 · 审题立意',kps:[
 {name:'审题三步',expl:'抓题眼（关键词）→ 明限制（人称/时间/数量）→ 定文体。立意“小切口、深挖掘”。',tips:'考向：作文50分左右，审题失误是最大失分点。',ex:[['以“那一刻，我长大了”为题，最合适的立意是？','把“长大”落到具体瞬间（第一次承担责任、第一次承认错误），以小见大。','【易错】避免空喊口号、泛泛而谈。']]},

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.style.display='block'; clearTimeout(t._h); t._h = setTimeout(()=>t.style.display='none', 2000); }
function daysTo(iso){ const t = new Date(iso + 'T00:00:00') - new Date(); return Math.max(0, Math.ceil(t/86400000)); }
function sub(id){ return SUBJECTS.find(s=>s.id===id); }
function colKey(subId, col){ return subId+':'+col; }
function kpKey(subId, col, kp){ return subId+'::'+col+'::'+kp; }
function lessonsOf(subId, col){ return KP[colKey(subId, col)] || fallbackKPs(col); }
function qsOf(subId, col){ return QS[colKey(subId, col)] || []; }
function totalKPs(subId){ let n=0; const s=sub(subId); s.columns.forEach(c=>{ lessonsOf(subId,c).forEach(l=> n+=l.kps.length); }); return n; }
function masteredKPs(subId){ let n=0; const s=sub(subId); s.columns.forEach(c=>{ lessonsOf(subId,c).forEach(l=> l.kps.forEach(kp=>{ if(marks[kpKey(subId,c,kp.name)] && marks[kpKey(subId,c,kp.name)].mastered) n++; })); }); return n; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

async function aiAnalyze(question, ansState, myAns, imgUrl, ai){
  const sys = '你是天津中考全科讲题老师，覆盖语文/数学/英语/物理/化学/道德与法治/历史/地理/生物/体育，任意题型（选择/填空/判断/简答/计算/证明/作文/材料题等）。规则：1) 若学生已作答：先明确判断“正确/错误”并给出判断依据（若错，指出错在哪一步、为什么错），再给出完整分步答题思路，最后详细说明本题所考知识点（概念、公式或方法、易错点、天津中考考向）；2) 若学生未作答：先直接给出正确答案，再给出完整分步答题思路，最后详细说明所考知识点；3) 题目可能来自所附图片，请结合图片识别内容作答，若图片不清晰请说明；4) 用 Markdown 输出三部分：①判断结果（或参考答案）②答题思路 ③知识点详解。';
  let user = '题目内容：'+(question || '（见所附图片）')+'\n是否已作答：'+(ansState==='done'?'已作答':'未作答')+'\n学生作答：'+(myAns || '（无）');
  const msg = {role:'user', content: imgUrl? [{type:'text', text:user},{type:'image_url', image_url:{url:imgUrl}}] : user};
  const res = await fetch((ai.base||'https://api.deepseek.com/v1').replace(/\/$/,'')+'/chat/completions', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+ai.key},
    body: JSON.stringify({model:ai.model||'deepseek-v4-flash', messages:[{role:'system', content:sys}, msg], temperature:0.3})
  });
  if(!res.ok){ throw new Error('HTTP '+res.status+' '+(await res.text()).slice(0,120)); }
  const data = await res.json();
  const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if(!content) throw new Error('AI 返回内容为空');
  return content;
}

function todayWords(){
  const bank = currentBank();
  let n = parseInt(dict.plan.daily, 10); if(!(n>0)) n = 10; if(n>100) n = 100;
  if(!bank.length) return [];
  const recs = dict.records;
  const done = bank.filter(w=>recs[w.en]);
  const undone = bank.filter(w=>!recs[w.en]);
  const hard = done.filter(w=>isHard(w.en));
  const other = done.filter(w=>!isHard(w.en));
  const repeatMax = Math.ceil(n/6);
  const parts = [];
  parts.push(...hard.slice(0, repeatMax));
  parts.push(...undone);
  const used = new Set(parts.map(w=>w.en));
  parts.push(...other.filter(w=>!used.has(w.en)));
  let idx = 0;
  while(parts.length < n){ parts.push(bank[idx % bank.length]); idx++; }
  return parts.slice(0, n);
}
function isHard(en){
  const r = dict.records[en]; return !!(r && (r.err/r.count>=0.4 || (r.err>0 && r.streak===0)));
}

function poolOrder(subId, col){
  const qs = qsOf(subId, col);
  const key = colKey(subId, col);
  let rec = pq[key] || {r:0, order:null, done:{}};
  if(!rec.order || rec.order.length !== qs.length){
    rec.order = qs.map((_,i)=>i);
    for(let i=rec.order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=rec.order[i]; rec.order[i]=rec.order[j]; rec.order[j]=t; }
    rec.done = rec.done || {};
    pq[key] = rec; store.set('pq', pq);
  }
  return rec;
}
function nextRound(subId, col){
  const key = colKey(subId, col);
  const rec = pq[key] || {r:0};
  rec.r = (rec.r||0) + 1;
  rec.order = null; rec.done = {};
  pq[key] = rec; store.set('pq', pq);
}

function looksLikeText(s){ const sample = String(s||'').slice(0,4000); const letters = (sample.match(/[A-Za-z\u4e00-\u9fff]/g)||[]).length; const total = sample.length||1; return (letters/total) > 0.5; }
function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=src; sc.onload=res; sc.onerror=()=>rej(new Error('联网加载解析组件失败')); document.head.appendChild(sc); }); }
async function extractPdfText(file){
  if(!window.pdfjsLib){ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'); }
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const data = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:data}).promise;
  const out = [];
  for(let i=1;i<=pdf.numPages;i++){ const pg = await pdf.getPage(i); const tc = await pg.getTextContent(); out.push(tc.items.map(it=>it.str).join(' ')); }
  return out.join('\n');
}
async function extractDocxText(file){
  if(!window.mammoth){ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js'); }
  const data = await file.arrayBuffer();
  const res = await window.mammoth.extractRawText({arrayBuffer:data});
  return res.value || '';
}
async function handleDictFile(file){
  const name = (file.name||'').toLowerCase();
  const ext = name.split('.').pop();
  const isImg = /^image\//.test(file.type) || ['jpg','jpeg','png','gif','bmp','webp'].includes(ext);
  const isPdf = file.type==='application/pdf' || ext==='pdf';
  const isDocx = ext==='docx';
  if(isImg){
    const url = URL.createObjectURL(file);
    const box = document.getElementById('dictCamInner');
    if(box) box.innerHTML = '<img src="'+url+'" style="max-width:70%;border-radius:8px">';
    toast('图片已就绪：点下方「手动逐词核对」开始批改');
    return;
  }
  let text = '';
  try{
    if(isPdf){ toast('正在解析 PDF…'); text = await extractPdfText(file); }
    else if(isDocx){ toast('正在解析 Word…'); text = await extractDocxText(file); }
    else if(ext==='doc'){ toast('老版 .doc 无法直接读取：请在 Word 中“另存为 .txt / .docx / PDF”后再上传'); return; }
    else { text = await file.text().catch(()=>''); }
  }catch(e){ toast('解析失败：'+e.message+'（可把内容另存为 .txt 后上传）'); return; }
  if(!text || !text.trim() || !looksLikeText(text)){ toast('未从文件中读到可批改的文字（扫描版 PDF 请转图片后拍照上传）'); return; }
  autoGradeTxt(text);
}
function autoGradeTxt(text){
  const words = todayWords();
  const mode = dict.plan.mode;
  const norm = (s)=> String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9\u4e00-\u9fff]+/g,' ');
  const hay = ' '+norm(text)+' ';
  const grades = {};
  words.forEach((w,i)=>{
    const raw = (mode==='en2cn') ? w.cn : w.en;
    const parts = String(raw).split(/[；;、，,，\/]/).map(s=>norm(s)).filter(Boolean);
    const ok = parts.some(p=> p && hay.indexOf(p)>=0);
    grades[i] = ok ? '1' : '0';
  });
  navTo('dictGrade','默写 · 文件自动批改',{grades:grades});
}

      const ok = String(v).trim().toLowerCase() === String(q.a).trim().toLowerCase();
      state.params.answers[i] = {v:v, ok:ok};
      poolOrder(state.params.sub, state.params.col).done[i] = true; store.set('pq', pq);
      bumpPrac(state.params.sub, state.params.col, ok);
      if(!ok) addWrong({sub:state.params.sub, col:state.params.col, kp:'章节练习', q:q.q, myAns:v||'未答', correct:qCorrectText(q), analysis:q.an, reason:'概念不清', source:'章节练习'});
      toast(ok?'✓ 回答正确':'✗ 答错，已加入错题本');
      render(); break;
    }
    case 'practiceReset': {
      const key = colKey(state.params.sub, state.params.col);
      const rec = pq[key]; if(rec){ rec.done = {}; pq[key]=rec; store.set('pq',pq); }
      if(state.params.answers) state.params.answers = {};
      render(); break;
    }
    case 'practiceNewRound': {
      nextRound(state.params.sub, state.params.col);
      if(state.params.answers) state.params.answers = {};
      render(); break;
    }

    /* 模考 */
    case 'examFilter': state.params.ef = id; render(); break;
    case 'genPaper': genPaper(el.getAttribute('data-sub')); break;
    case 'genPaperAny': genPaper(PAPERS.length? PAPERS[0].sub : ''); break;
    case 'examStart': startExam(id); break;
    case 'examPick': {
      const i = +el.getAttribute('data-i'), v = +el.getAttribute('data-v');
      if(!state.params.answers) state.params.answers = {};
      state.params.answers[i] = {v:v};
      render(); break;
    }
    case 'examSubmit': submitExam(); break;
    case 'examRestart': startExam(id); break;

    /* 默写 */
    case 'planDaily': dict.plan.daily = +id; store.set('dict', dict); render(); break;
    case 'planMode': dict.plan.mode = id; store.set('dict', dict); render(); break;
    case 'dictGradeGo': navTo('dictGrade', '默写 · 核对批改', {grades:{}}); break;
    case 'dictCamPick': { const f = document.getElementById('dictFile'); if(f) f.click(); break; }
    case 'dictFilePick': { const f = document.getElementById('dictFileTxt'); if(f) f.click(); break; }
    case 'gradeWord': {
      const idx = el.getAttribute('data-idx'), v = el.getAttribute('data-v');
      if(!state.params.grades) state.params.grades = {};
      state.params.grades[idx] = v;
      const row = el.closest('.word-row');
      row.querySelector('.ok').classList.toggle('ok-on', v==='1');
      row.querySelector('.no').classList.toggle('no-on', v==='0');
      break;
    }
    case 'dictSave': {
      const words = todayWords(); const g = state.params.grades||{};
      words.forEach((w,i)=>{
        const r = dict.records[w.en] || {count:0, err:0, streak:0, last:''};
        r.count++; r.last = todayStr();
        if(g[i]==='0'){ r.err++; r.streak = 0; } else { r.streak++; }
        dict.records[w.en] = r;
      });
      dict.done[todayStr()] = words.length;
      store.set('dict', dict);
      toast('已存档：默写次数 / 错误次数已更新');
      navTo('dictStats', '默写统计', {}); break;
    }

    case 'speak': speak(el.getAttribute('data-word')); break;
    case 'importBank': {
      const ta = document.getElementById('importWords');
      const lines = (ta? ta.value : '').split('\n').map(s=>s.trim()).filter(Boolean);
      const arr = [];
      lines.forEach(line=>{
        const parts = line.split(',');
        const en = (parts[0]||'').trim();
        if(!en) return;
        arr.push({en: en, pos: ((parts[1]||'').trim()) || '', cn: parts.slice(2).join(',').trim() || en});
      });
      if(!arr.length){ toast('请先粘贴单词（每行：单词,词性,中文）'); return; }
      dict.custom = arr;
      dict.plan.source = '自定义导入词表';
      store.set('dict', dict);
      toast('已导入 '+arr.length+' 词，并设为当前词表');
      render(); break;
    }
    case 'clearBank': {
      dict.custom = [];
      if(dict.plan.source === '自定义导入词表') dict.plan.source = '中考核心词汇';
      store.set('dict', dict);
      toast('已清空自定义词表'); render(); break;
    }
    case 'saveAI': {
      const g = (i)=> document.getElementById(i) ? document.getElementById(i).value.trim() : '';
      saveAICfg({base: g('aiBase') || 'https://api.deepseek.com/v1', key: g('aiKey'), model: g('aiModel') || 'deepseek-v4-flash-vision-exp'});
      toast('AI 设置已保存');
      render(); break;
    }
    case 'clearSample': wrongBook = wrongBook.filter(w=>!w.sample); store.set('wb', wrongBook); toast('已清空示例错题'); render(); break;
    case 'resetAll': {
      if(confirm('确认重置全部数据？')){ try{ Object.keys(localStorage).filter(k=>k.indexOf('tjzk_')===0).forEach(k=>localStorage.removeItem(k)); }catch(_){}
        location.reload(); }
      break;
    }
  }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t.matches('[data-act="exportSub"]')){ state.params.exportSub = t.value; render(); }
  else if(t.matches('[data-act="planSource"]')){ dict.plan.source = t.value; store.set('dict', dict); render(); }
  else if(t.id==='camFile'){
    if(t.files && t.files[0]){
      const f = t.files[0];
      const url = URL.createObjectURL(f);
      pickedPhoto = url; pickedDataUrl = null;
      const box = document.getElementById('camBox'), inner = document.getElementById('camInner');
      if(box) box.style.padding = '0';
      if(inner) inner.innerHTML = `<img src="${url}" alt="拍摄的题目">`;
      const fr = new FileReader();
      fr.onload = ()=>{ pickedDataUrl = fr.result; toast('图片已就绪：已作答→先判对错再给思路+知识点；未作答→直接给答案+思路+知识点'); };
      fr.readAsDataURL(f);
    }
  }
  else if(t.id==='dictFile'){
    if(t.files && t.files[0]){
      const url = URL.createObjectURL(t.files[0]);
      const box = document.getElementById('dictCamInner');
      if(box) box.innerHTML = '<img src="'+url+'" style="max-width:70%;border-radius:8px">';
      toast('图片已就绪：点下方「手动逐词核对」开始批改（正式版由 OCR 自动识别）');
    }
  }
  else if(t.id==='dictFileTxt'){
    if(t.files && t.files[0]) handleDictFile(t.files[0]);
  }
});

/* ========== 启动 ========== */
render();
setInterval(examTick, 1000);
</script>
